<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="meta-theme-color" name="theme-color" content="#f4f4f2" />
    <link rel="manifest" href="/app/manifest.json" />
    <link rel="icon" type="image/png" href="/app/murago-logo.png" />
    <title>Murago Coffee ERP — Bean Power ERP</title>
    <script>
      /* Theme init — runs before first paint to prevent flash of wrong theme.
         Persisted choice wins; otherwise follow prefers-color-scheme. */
      (function () {
        try {
          var saved = localStorage.getItem('murago_theme')
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          var meta = document.getElementById('meta-theme-color')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#12100e' : '#f4f4f2')
        } catch (e) { document.documentElement.dataset.theme = 'light' }
      })()
    </script>
    <script type="module" crossorigin src="/app/assets/index-DSwevPlM.js"></script>
    <link rel="stylesheet" crossorigin href="/app/assets/index-DRMn7t2-.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
